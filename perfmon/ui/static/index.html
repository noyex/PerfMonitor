<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico">
  <title>PerfMonitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preload" href="/vendor/nohemi/n400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/vendor/nohemi/n500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/uPlot.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/pages/overview.css">
  <link rel="stylesheet" href="/pages/games.css">
  <link rel="stylesheet" href="/pages/compare.css">
  <link rel="stylesheet" href="/pages/problems.css">
</head>
<body>
  <canvas id="gl" aria-hidden="true" hidden></canvas>
  <div id="gl-fallback" aria-hidden="true" hidden></div>
  <div class="shell">
    <a class="brand" href="#/overview">PerfMonitor</a>
    <main id="view"></main>
    <footer class="dock slab">
      <nav>
        <a href="#/overview">Przegląd</a>
        <a href="#/timeline">Oś czasu</a>
        <a href="#/games">Gry</a>
        <a href="#/compare">Porównania</a>
        <a href="#/problems">Problemy</a>
      </nav>
      <div class="temps">
        <span class="status" id="status" hidden></span>
        <span>CPU <b id="temp-cpu">–</b></span>
        <span>GPU <b id="temp-gpu">–</b></span>
      </div>
    </footer>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/vendor/uPlot.iife.min.js"></script>
  <script src="/lib.js"></script>
  <script src="/mercury.js"></script>
  <script src="/pages/overview.js"></script>
  <script src="/pages/timeline.js"></script>
  <script src="/pages/games.js"></script>
  <script src="/pages/compare.js"></script>
  <script src="/pages/problems.js"></script>
  <script src="/app.js"></script>
</body>
</html>
